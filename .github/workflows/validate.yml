# データの検証。travel-log 本体はこのリポジトリの main を raw で直接読むため、
# 壊れた CSV が main に入った時点で取り込みが壊れる(ブランチ保護は掛けていないので、
# 事故を止めるのはここだけ)。検査の中身は .github/scripts/validate_data.py が正
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 依存は無し(標準ライブラリのみ)。データリポジトリに requirements を持ち込まない
      - run: python3 .github/scripts/validate_data.py

  # Dependabot の PR のうち、破壊的でない更新(patch / minor)を自動でマージする。
  #
  # needs が唯一のゲート —— ブランチ保護は掛けていない運用なので、
  # 「CI が通ってからマージする」をジョブの依存関係で表している。
  # major は自動で入れない(壊れ方が読めないので人が見る)。
  auto-merge:
    needs: validate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 更新の種類を読む
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: patch / minor ならマージする
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
